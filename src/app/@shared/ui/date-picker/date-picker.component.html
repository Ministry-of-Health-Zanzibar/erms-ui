<mat-form-field
  appFormField
  [fieldErrorId]="feedback.errorId"
  [fieldHintId]="fieldHints?.length ? feedback.hintId : ''"
  [fieldControl]="fieldControl"
  class="ui-date-picker"
  appearance="outline"
  subscriptSizing="dynamic"
>
  @if (icon) {
    <mat-icon matPrefix aria-hidden="true">{{ icon }}</mat-icon>
  }

  @if (label) {
    <mat-label>{{ label }}</mat-label>
  }

  <input
    matInput
    [matDatepicker]="picker"
    [ngModel]="value"
    [ngModelOptions]="{ standalone: true }"
    [min]="minDate"
    [max]="maxDate"
    [matDatepickerFilter]="dateFilter"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [required]="isFieldRequired"
    (ngModelChange)="updateValue($event)"
    (blur)="markAsTouched()"
  />

  @if (allowClear && value) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="ui-date-picker__clear"
      [attr.aria-label]="'Clear ' + (label || 'date')"
      (click)="clearValue($event)"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  }

  <mat-datepicker-toggle matSuffix [for]="picker" />
  <mat-datepicker #picker />
</mat-form-field>

<app-field-feedback #feedback [control]="fieldControl" [label]="label"
  [hasCustomErrors]="!!fieldErrors?.length" [hasHints]="!!fieldHints?.length">
  <span uiFieldErrors><ng-content select="mat-error" /></span>
  <span uiFieldHints><ng-content select="mat-hint" /></span>
</app-field-feedback>
