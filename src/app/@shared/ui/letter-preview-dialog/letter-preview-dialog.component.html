<section class="letter-preview-dialog" aria-labelledby="letter-preview-title">
  <header class="letter-preview-dialog__header">
    <div class="letter-preview-dialog__identity">
      <span class="letter-preview-dialog__icon" aria-hidden="true">
        <mat-icon>description</mat-icon>
      </span>
      <div>
        <span class="letter-preview-dialog__eyebrow">Backend-generated document</span>
        <h2 id="letter-preview-title">{{ heading }}</h2>
        <p>{{ description }}</p>
      </div>
    </div>
    <button mat-icon-button type="button" aria-label="Close" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="letter-preview-dialog__body">
    <div class="letter-preview-dialog__notice">
      <mat-icon>verified_user</mat-icon>
      <span>The PDF is constructed by Laravel and will be tracked when printing starts.</span>
    </div>

    <div class="letter-preview-dialog__language-list" role="radiogroup" aria-label="Letter language">
      <button
        *ngFor="let option of options"
        type="button"
        class="letter-preview-dialog__language"
        [class.letter-preview-dialog__language--selected]="language === option.value"
        [attr.aria-checked]="language === option.value"
        role="radio"
        (click)="language = option.value"
      >
        <span class="letter-preview-dialog__language-icon"><mat-icon>{{ option.icon }}</mat-icon></span>
        <span class="letter-preview-dialog__language-copy">
          <strong>{{ option.label }}</strong>
          <small>{{ option.description }}</small>
        </span>
        <mat-icon class="letter-preview-dialog__check">{{ language === option.value ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
      </button>
    </div>
  </div>

  <footer class="letter-preview-dialog__footer">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="loading" (click)="preview()">
      <mat-icon>{{ loading ? 'hourglass_top' : 'visibility' }}</mat-icon>
      {{ loading ? 'Preparing letter…' : 'Review letter' }}
    </button>
  </footer>
</section>
