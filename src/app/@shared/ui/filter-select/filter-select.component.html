<mat-form-field
  appFormField
  [fieldErrorId]="feedback.errorId"
  [fieldHintId]="fieldHints?.length ? feedback.hintId : ''"
  [fieldControl]="fieldControl"
  class="ui-filter-select"
  appearance="outline"
  subscriptSizing="dynamic"
>
  @if (icon) {
    <mat-icon matPrefix aria-hidden="true">{{ icon }}</mat-icon>
  }

  <mat-label>{{ label }}</mat-label>
  <mat-select
    [appSearchableSelect]="searchable"
    [selectSearchRemote]="remoteSearch"
    [value]="value"
    [disabled]="disabled"
    [required]="isFieldRequired"
    [multiple]="multiple"
    panelClass="ui-filter-select-panel"
    [attr.aria-label]="label"
    (selectionChange)="updateValue($event.value)"
    (openedChange)="handleOpenedChange($event)"
    (selectSearchChange)="updateSearch($event)"
  >
    @if (!multiple && allowDeselect) {
      <mat-option [value]="emptyValue">{{ placeholder }}</mat-option>
    }

    @for (option of filteredOptions; track $index) {
      <mat-option [value]="option.value">{{ option.label }}</mat-option>
    }

    @if (filteredOptions.length === 0) {
      <mat-option disabled>No matching options</mat-option>
    }
  </mat-select>

  @if (allowDeselect && hasValue) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="ui-filter-select__clear"
      [attr.aria-label]="'Clear ' + label"
      (click)="clearSelection($event)"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  }
</mat-form-field>

<app-field-feedback #feedback [control]="fieldControl" [label]="label"
  [hasCustomErrors]="!!fieldErrors?.length" [hasHints]="!!fieldHints?.length">
  <span uiFieldErrors><ng-content select="mat-error" /></span>
  <span uiFieldHints><ng-content select="mat-hint" /></span>
</app-field-feedback>
