<mat-form-field
  appFormField
  [fieldErrorId]="feedback.errorId"
  [fieldHintId]="fieldHints?.length ? feedback.hintId : ''"
  [fieldControl]="fieldControl"
  class="ui-text-input"
  appearance="outline"
  [subscriptSizing]="subscriptSizing"
>
  @if (icon) {
    <mat-icon matSuffix aria-hidden="true">{{ icon }}</mat-icon>
  }

  @if (label) {
    <mat-label>{{ label }}</mat-label>
  }

  <input
    matInput
    [type]="passwordToggle ? (passwordVisible ? 'text' : 'password') : type"
    [value]="value ?? ''"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [attr.inputmode]="inputmode || null"
    [required]="required || isFieldRequired"
    [readonly]="readonly"
    [disabled]="disabled"
    [attr.min]="min"
    [attr.max]="max"
    [attr.step]="step"
    (input)="updateValue($any($event.target).value)"
    (blur)="markAsTouched()"
  />

  @if (allowClear && hasValue) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="ui-text-input__clear"
      [attr.aria-label]="'Clear ' + (label || 'input')"
      (click)="clearValue($event)"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  }

  @if (passwordToggle) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="ui-text-input__password-toggle"
      [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
      (click)="togglePasswordVisibility($event)"
    >
      <mat-icon aria-hidden="true">
        {{ passwordVisible ? 'visibility_off' : 'visibility' }}
      </mat-icon>
    </button>
  }

  <ng-content select="[matSuffix]" />
</mat-form-field>

<app-field-feedback #feedback [control]="fieldControl" [label]="label"
  [hasCustomErrors]="!!fieldErrors?.length" [hasHints]="!!fieldHints?.length">
  <span uiFieldErrors><ng-content select="mat-error" /></span>
  <span uiFieldHints><ng-content select="mat-hint" /></span>
</app-field-feedback>
