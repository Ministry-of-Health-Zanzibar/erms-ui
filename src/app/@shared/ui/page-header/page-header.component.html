<header class="ui-page-header">
  <div class="ui-page-header__identity">
    <span class="ui-page-header__icon" aria-hidden="true">
      <mat-icon>{{ icon }}</mat-icon>
    </span>

    <div>
      <h1>{{ title }}</h1>
      @if (description) {
        <p>{{ description }}</p>
      }
    </div>
  </div>

  <div class="ui-page-header__actions">
    <ng-content select="[uiPageActions]" />
  </div>
</header>
