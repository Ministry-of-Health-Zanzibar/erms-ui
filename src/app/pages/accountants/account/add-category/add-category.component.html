<div class="ui-form-dialog">
  <app-form-header
    eyebrow="Accounting configuration"
    [title]="categoryData ? 'Update category' : 'Create category'"
    description="Manage accounting document categories."
    icon="category"
  />

  <div class="ui-form-dialog__body">
      <form [formGroup]="categoryForm">
        <mat-form-field appFormField class="w-full mt-6">
          <mat-label>category Name: </mat-label>
          <input matInput placeholder="Ex. category" formControlName="category_name" type="text">
          <mat-error class="error-message" *ngIf="categoryForm.controls['category_name'].touched && categoryForm.controls['category_name'].invalid">
            <span *ngIf="categoryForm.controls['category_name'].errors?.['required']">This field is mandatory</span>
          </mat-error>
        </mat-form-field>


      </form>
  </div>

  <mat-dialog-actions align="end" class="ui-form-dialog__actions">
    <button mat-button mat-dialog-close>Cancel</button>
    <button *ngIf="!categoryData" mat-flat-button cdkFocusInitial [disabled]="categoryForm.invalid || submitting" (click)="savecategory()">{{ submitting ? 'Saving...' : 'Save Category' }}</button>
    <button *ngIf="categoryData" mat-flat-button cdkFocusInitial [disabled]="categoryForm.invalid || submitting" (click)="updatecategory()">{{ submitting ? 'Saving...' : 'Update Category' }}</button>
  </mat-dialog-actions>
</div>
