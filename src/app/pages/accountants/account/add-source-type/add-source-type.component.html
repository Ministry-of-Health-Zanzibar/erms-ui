<div class="ui-form-dialog">
  <app-form-header
    eyebrow="Accounting configuration"
    [title]="sourceData ? 'Update source type' : 'Create source type'"
    description="Define a source type for accounting records."
    icon="source"
  />

  <div class="ui-form-dialog__body">
      <form [formGroup]="sourceForm">
        <mat-form-field appFormField class="w-full mt-6">
          <mat-label>Source Name</mat-label>
          <mat-select appSearchableSelect formControlName="source_id">
            <mat-option *ngFor="let s of source" [value]="s.source_id">
              {{ s.source_name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appFormField class="w-full mt-6">
          <mat-label>Source Type Name: </mat-label>
          <input matInput placeholder="Ex. source" formControlName="source_type_name" type="text">
          <mat-error class="error-message" *ngIf="sourceForm.controls['source_type_name'].touched && sourceForm.controls['source_type_name'].invalid">
            <span *ngIf="sourceForm.controls['source_type_name'].errors?.['required']">This field is mandatory</span>
          </mat-error>
        </mat-form-field>




      </form>
  </div>

  <mat-dialog-actions align="end" class="ui-form-dialog__actions">
    <button mat-button mat-dialog-close>Cancel</button>
    <button *ngIf="!sourceData" mat-flat-button cdkFocusInitial [disabled]="sourceForm.invalid || submitting" (click)="savesource()">{{ submitting ? 'Saving...' : 'Save Source Type' }}</button>
    <button *ngIf="sourceData" mat-flat-button cdkFocusInitial [disabled]="sourceForm.invalid || submitting" (click)="updatesource()">{{ submitting ? 'Saving...' : 'Update Source Type' }}</button>
  </mat-dialog-actions>
</div>
