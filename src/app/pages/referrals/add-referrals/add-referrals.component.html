<div class="ui-form-dialog">
  <app-form-header
    eyebrow="Patient referrals"
    [title]="id ? 'Update referral' : 'Create referral'"
    description="Select a patient and the reason for referral."
    icon="assignment"
  />

  <div class="ui-form-dialog__body">
      <form [formGroup]="referralsForm" class="horizontal-form">
        <!-- Patient Name -->
        <div class="form-row">
          <mat-form-field appFormField appearance="outline" class="w-full">
            <mat-label>Patient Name</mat-label>
            <mat-select appSearchableSelect formControlName="patient_id"
              [selectSearchRemote]="true" selectSearchPlaceholder="Search patients…"
              (selectSearchChange)="patientSearchCtrl.setValue($event)">
              <mat-option *ngIf="!patients.length" disabled>Search for an available patient</mat-option>
              <mat-option *ngFor="let patient of patients" [value]="patient.patient_id">
                {{ patient.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Reason -->
        <div class="form-row">
          <mat-form-field appFormField appearance="outline" class="w-full">
            <mat-label>Reason</mat-label>
            <mat-select appSearchableSelect formControlName="reason_id">
              <mat-option *ngFor="let r of reason" [value]="r.reason_id">
                {{ r.referral_reason_name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </form>
  </div>

  <mat-dialog-actions align="end" class="ui-form-dialog__actions">
      <button
        mat-button
        mat-dialog-close
        class="!text-red-600 hover:!text-red-700 font-semibold"
      >
        Cancel
      </button>
      <button
        mat-flat-button
        color="primary"
        *ngIf="!id"
        [disabled]="referralsForm.invalid"
        (click)="saveReferrals()"
      >
        Save Data
      </button>
      <button
        mat-flat-button
        color="accent"
        *ngIf="id"
        [disabled]="referralsForm.invalid"
        (click)="updateReferrals()"
      >
        Update
      </button>
    </mat-dialog-actions>
</div>
