<section class="boarded-out-letter" aria-labelledby="boarded-out-letter-title">
  <header class="boarded-out-letter__header">
    <div class="boarded-out-letter__identity">
      <span class="boarded-out-letter__icon" aria-hidden="true"><mat-icon>description</mat-icon></span>
      <div>
        <span class="boarded-out-letter__eyebrow">Backend-generated document</span>
        <h2 id="boarded-out-letter-title">Boarded-out letter</h2>
        <p>Choose the language and review the official Laravel-generated letter before printing.</p>
      </div>
    </div>
    <button mat-icon-button type="button" aria-label="Close" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="boarded-out-letter__body">
    <div class="boarded-out-letter__notice">
      <mat-icon>verified_user</mat-icon>
      <span>The letter remains inside ERIS and its print event is recorded for audit.</span>
    </div>

    <div class="boarded-out-letter__languages" role="radiogroup" aria-label="Letter language">
      <button
        type="button"
        class="boarded-out-letter__language"
        [class.boarded-out-letter__language--selected]="language === 'en'"
        [attr.aria-checked]="language === 'en'"
        role="radio"
        (click)="language = 'en'"
      >
        <mat-icon>translate</mat-icon>
        <span><strong>English version</strong><small>Official English document</small></span>
        <mat-icon>{{ language === 'en' ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
      </button>

      <button
        type="button"
        class="boarded-out-letter__language"
        [class.boarded-out-letter__language--selected]="language === 'sw'"
        [attr.aria-checked]="language === 'sw'"
        role="radio"
        (click)="language = 'sw'"
      >
        <mat-icon>language</mat-icon>
        <span><strong>Toleo la Kiswahili</strong><small>Barua rasmi ya Kiswahili</small></span>
        <mat-icon>{{ language === 'sw' ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
      </button>
    </div>
  </div>

  <footer class="boarded-out-letter__footer">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="loading || !historyId" (click)="preview()">
      <mat-icon>{{ loading ? 'hourglass_top' : 'visibility' }}</mat-icon>
      {{ loading ? 'Preparing letter…' : 'Review letter' }}
    </button>
  </footer>
</section>
