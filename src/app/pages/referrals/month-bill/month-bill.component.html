<div class="p-10 space-y-8" *ngIf="permission.parmissionMatched(['View Monthly Bill'])">
  <app-page-header
    title="Monthly bills"
    description="Review hospital monthly billing totals and audited amounts."
    icon="calendar_month"
  />

  <app-section-card
    title="Monthly billing records"
    description="Search monthly totals or add a new billing period."
    icon="payments"
  >
      <app-table-toolbar>
        <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
          <div class="size-9 rounded-full border bg-surface flex flex items-center justify-center" (click)="renew()" matTooltip="Refresh">
            <mat-icon class="font-icon visibilityData">refresh</mat-icon>
          </div>
          <emr-v-divider></emr-v-divider>
          <input type="text" placeholder="Search..."
                 class="border-b h-10 w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950" matInput (keyup)="applyFilter($event)" #input>
        </div>
        <div uiToolbarActions>
          <button mat-flat-button (click)="addMonth()" *ngIf="permission.parmissionMatched(['Create Monthly Bill'])">
            <mat-icon class="font-icon">add</mat-icon>Add Month
          </button>
        </div>
      </app-table-toolbar>

    <div class="border dark:border-inverse rounded-lg overflow-x-auto">
  <table mat-table [dataSource]="dataSource" class="not-prose">

    <!-- Position Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> No. </th>
      <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
    </ng-container>

    <!-- Hospital Name -->
    <ng-container matColumnDef="hospital_name">
      <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Hospital Name </th>
      <td mat-cell *matCellDef="let element"> {{element.hospital_name}} </td>
    </ng-container>

    <!-- Total Current Bill -->
    <ng-container matColumnDef="total_monthly_bill">
      <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Total Monthly Bill </th>
      <td mat-cell *matCellDef="let element"> {{element.total_monthly_bill | number}} </td>
    </ng-container>

    <!-- Total After Audit -->
    <ng-container matColumnDef="total_after_audit_monthly_bill">
      <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Total After Audit Bill </th>
      <td mat-cell *matCellDef="let element"> {{element.total_after_audit_monthly_bill | number}} </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400" style="text-align: center;"> Action </th>
      <td mat-cell *matCellDef="let element">
        <emr-segmented theme="simple" class="-mx-2">
          <emr-segmented-button value="visibilityData">
            <span
              class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
              (click)="displayMoreData(element)"
              matTooltip="View"
            >
              <mat-icon class="font-icon">visibility</mat-icon>
            </span>
          </emr-segmented-button>
          <emr-segmented-button value="edit_squareData">
            <span class="size-9 rounded-full border bg-surface flex items-center justify-center"
                  (click)="updateMonthBill(element)"
                  *ngIf="permission.parmissionMatched(['Update Monthly Bill'])"
                  matTooltip="Edit">
              <mat-icon class="font-icon edit_squareData">edit_square</mat-icon>
            </span>
          </emr-segmented-button>
        </emr-segmented>
      </td>
    </ng-container>

    <!-- Header & Row Definitions -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Empty Row -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell tablefoter" colspan="10">
        <app-empty-state
          title="No monthly bills found"
          [message]="input.value ? 'No monthly bills match your search.' : 'Monthly billing records will appear here.'"
          icon="event_busy"
        />
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 20]" showFirstLastButtons aria-label="Select page of permission" class="pt-3">
  </mat-paginator>
</div>

  </app-section-card>

  <app-loading-state
    *ngIf="loading"
    label="Loading monthly bills…"
    [overlay]="true"
  />

</div>
