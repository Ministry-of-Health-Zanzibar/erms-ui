<div
  class="p-10 space-y-8"
  *ngIf="permission.parmissionMatched(['View BillFile'])"
>
  <app-page-header
    title="Bill files"
    description="Review hospital billing summaries and open their details."
    icon="folder_open"
  />

  <app-section-card
    title="Hospital bill files"
    description="Search billing summaries or create a new bill file."
    icon="receipt_long"
  >
    <app-table-toolbar>
      <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
        <div
          class="size-9 rounded-full border bg-surface flex items-center justify-center"
          (click)="loadBills()"
          matTooltip="Refresh"
        >
          <mat-icon>refresh</mat-icon>
        </div>
        <emr-v-divider></emr-v-divider>
        <input
          type="text"
          placeholder="Search..."
          class="border-b h-10 w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950"
          matInput
          (keyup)="applyFilter($event)"
          #input
        />
      </div>

      <div uiToolbarActions>
        <button
          mat-flat-button
          color="primary"
          (click)="addBill()"
          *ngIf="permission.parmissionMatched(['Create BillFile'])"
        >
          <mat-icon>add</mat-icon> Add Bill
        </button>
      </div>
    </app-table-toolbar>

    <div class="border dark:border-inverse rounded-lg overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="not-prose">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="hospital_name">
          <th mat-header-cell *matHeaderCellDef>Hospital name</th>
          <td mat-cell *matCellDef="let element">
            {{ element.hospital_name }}
          </td>
        </ng-container>

       <ng-container matColumnDef="amount">
  <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let element">
        {{
          element.total_bill_amount
            | currency:
              (element.hospital_name === 'Madras Institute of Orthopaedics and Traumatology (MIOT)'
                ? 'USD'
                : 'TZS')
              :'symbol':'1.0-0'
        }}
      </td>
    </ng-container>


        <ng-container matColumnDef="action">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="text-neutral-500 dark:text-neutral-400"
          >
            Action
          </th>
          <td mat-cell *matCellDef="let element">
            <emr-segmented theme="simple" class="-mx-2">
              <emr-segmented-button value="edit_squareData">
                <span
                  class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
                  (click)="displayMoreData(element)"
                  matTooltip="View"
                >
                  <mat-icon class="font-icon">visibility</mat-icon>
                </span>

               
              </emr-segmented-button>
            </emr-segmented>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr *ngIf="dataSource.data.length === 0">
          <td [attr.colspan]="displayedColumns.length" class="text-center p-4">
            <app-empty-state
              title="No bill files found"
              [message]="input.value ? 'No bill files match your search.' : 'Hospital bill files will appear here.'"
              icon="folder_off"
            />
          </td>
        </tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[10, 20]"
        showFirstLastButtons
      ></mat-paginator>
    </div>
  </app-section-card>

  <app-loading-state
    *ngIf="loading"
    label="Loading bill files…"
    [overlay]="true"
  />
</div>
