<div class="p-10 space-y-8">
  <app-page-header title="Bill Items" description="Review and add the individual charges recorded on this bill." icon="receipt_long" />
  <app-section-card title="Bill item records" description="Search bill items or open an item for more details." icon="list_alt">
    <app-table-toolbar>
      <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
        <!-- <button mat-icon-button (click)="getBillItemsByBillId(bill_id!)" matTooltip="Refresh">
          <mat-icon>refresh</mat-icon>
        </button> -->
        <emr-v-divider></emr-v-divider>

        <input
          type="text"
          placeholder="Search..."
          class="border-b h-10 w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950"
          matInput
          (keyup)="applyFilter($event)"
          #input
        />
      </div>

      <div uiToolbarActions>
        <button
          mat-flat-button
          color="primary"
          (click)="addBillIterm(+bill_id!)"
        >
          <mat-icon>add</mat-icon>
          Add Bill Item
        </button>
      </div>
    </app-table-toolbar>

    <div class="border dark:border-inverse rounded-lg overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="not-prose w-full">
        <!-- Bill Item ID -->
        <ng-container matColumnDef="bill_item_id">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <!-- Description -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>

        <!-- Amount -->
        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Amount</th>
          <td mat-cell *matCellDef="let element">
            {{ element.amount | currency : "TZS " }}
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let element">
            <span
              class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
              (click)="displayMoreData(element)"
              matTooltip="View"
            >
              <mat-icon class="font-icon">visibility</mat-icon>
            </span>
          </td>
        </ng-container>

        <!-- Header & Row -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- No Data -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length"><app-empty-state title="No bill items found" [message]="input.value ? 'No bill items match your search.' : 'Bill items will appear here.'" icon="receipt_long" /></td>
        </tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[10, 20]"
        showFirstLastButtons
      ></mat-paginator>
    </div>
  </app-section-card>

  <app-loading-state *ngIf="loading" label="Loading bill items…" [overlay]="true" />
</div>
