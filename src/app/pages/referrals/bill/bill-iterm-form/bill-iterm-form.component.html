
<div class="ui-form-dialog">
  <app-form-header
    eyebrow="Referral billing"
    title="Add bill item"
    description="Enter the item description and amount."
    icon="receipt_long"
  />

  <form [formGroup]="billForm" class="min-h-0 overflow-auto">
    <div class="ui-form-dialog__body">
      <!-- Description -->
      <mat-form-field appFormField class="w-full" appearance="outline">
        <mat-label>Description</mat-label>
        <input
          matInput
          formControlName="description"
          placeholder="Enter item description"
        />
        <mat-error
          *ngIf="
            billForm.get('description')?.invalid &&
            billForm.get('description')?.touched
          "
        >
          Description is required
        </mat-error>
      </mat-form-field>

      <!-- Amount -->
      <mat-form-field appFormField class="w-full" appearance="outline">
        <mat-label>Amount</mat-label>
        <input
          matInput
          type="number"
          formControlName="amount"
          placeholder="Enter amount"
        />
        <mat-error
          *ngIf="
            billForm.get('amount')?.invalid && billForm.get('amount')?.touched
          "
        >
          Amount is required and must be positive
        </mat-error>
      </mat-form-field>
    </div>

    <div mat-dialog-actions align="end" class="ui-form-dialog__actions">
      <button mat-button (click)="onCancel()">Cancel</button>
      <button
        mat-flat-button
        color="primary"
        [disabled]="billForm.invalid"
        (click)="onSave()"
      >
        Save
      </button>
    </div>
  </form>
</div>
