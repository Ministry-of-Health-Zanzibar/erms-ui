<div class="mb-4 flex justify-end">
  <button mat-raised-button color="primary" (click)="openAddDialog()">
    <mat-icon>add</mat-icon> Add Bill Item
  </button>
</div>

<div class="mat-elevation-z8" *ngIf="!loading; else loadingTemplate">
  <mat-form-field appearance="outline" class="w-full mb-4">
    <mat-label>Filter</mat-label>
    <input matInput (input)="applyFilter($event)" placeholder="Search bill items">
  </mat-form-field>

  <div *ngIf="errorMessage" class="p-4 text-red-700 bg-red-50 rounded-lg" role="alert">
    {{ errorMessage }}
    <button mat-button color="primary" type="button" (click)="loadBillItems()">Retry</button>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="w-full" *ngIf="!errorMessage">

    <!-- Bill ID Column -->
    <ng-container matColumnDef="bill_id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Bill ID</th>
      <td mat-cell *matCellDef="let element">{{ element.bill_id }}</td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
      <td mat-cell *matCellDef="let element">{{ element.description }}</td>
    </ng-container>

    <!-- Amount Column -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
      <td mat-cell *matCellDef="let element">{{ element.amount | currency:'TZS' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center p-4" [attr.colspan]="displayedColumns.length">
        <app-empty-state title="No bill items found" [message]="searchTerm ? 'No bill items match your search.' : 'Bill items will appear here.'" icon="receipt_long" />
      </td>
    </tr>
  </table>

  <mat-paginator
    *ngIf="!errorMessage"
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="currentPage - 1"
    [pageSizeOptions]="[10, 25, 50]"
    showFirstLastButtons
    (page)="pageChanged($event)"
  ></mat-paginator>
</div>

<ng-template #loadingTemplate>
  <app-loading-state label="Loading bill items…" />
</ng-template>
