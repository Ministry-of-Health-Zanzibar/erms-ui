<section class="follow-up-letter-picker" aria-labelledby="follow-up-letter-title">
  <header class="follow-up-letter-picker__header">
    <div class="follow-up-letter-picker__identity">
      <span class="follow-up-letter-picker__icon"><mat-icon>event_note</mat-icon></span>
      <div>
        <span>Backend-generated document</span>
        <h2 id="follow-up-letter-title">Follow-up letter</h2>
        <p>Choose a language and review the official PDF before printing.</p>
      </div>
    </div>
    <button mat-icon-button type="button" aria-label="Close" (click)="close()"><mat-icon>close</mat-icon></button>
  </header>

  <div class="follow-up-letter-picker__body">
    <div class="follow-up-letter-picker__notice">
      <mat-icon>verified_user</mat-icon>
      Printing is recorded for DG and Super Admin audit visibility.
    </div>

    <div class="follow-up-letter-picker__choices" role="radiogroup" aria-label="Letter language">
      <button type="button" [class.selected]="language === 'en'" (click)="language = 'en'" role="radio" [attr.aria-checked]="language === 'en'">
        <mat-icon>translate</mat-icon>
        <span><strong>English version</strong><small>Official English follow-up letter</small></span>
        <mat-icon>{{ language === 'en' ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
      </button>
      <button type="button" [class.selected]="language === 'sw'" (click)="language = 'sw'" role="radio" [attr.aria-checked]="language === 'sw'">
        <mat-icon>language</mat-icon>
        <span><strong>Toleo la Kiswahili</strong><small>Barua rasmi ya ufuatiliaji</small></span>
        <mat-icon>{{ language === 'sw' ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
      </button>
    </div>
  </div>

  <footer class="follow-up-letter-picker__footer">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="loading || !letterId" (click)="preview()">
      <mat-icon>{{ loading ? 'hourglass_top' : 'visibility' }}</mat-icon>
      {{ loading ? 'Preparing letter…' : 'Review letter' }}
    </button>
  </footer>
</section>
