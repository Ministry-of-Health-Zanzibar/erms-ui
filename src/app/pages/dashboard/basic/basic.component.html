<div class="p-4 md:p-10 space-y-6 md:space-y-8">
  <app-page-header title="Dashboard" description="Monitor accounting document activity, sources, and classifications." icon="dashboard" />

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
    <app-section-card title="Documents per week" description="Weekly accounting document volume." icon="date_range">
      <div class="relative min-h-72"><canvas id="documentPerWeekChart"></canvas></div>
    </app-section-card>

    <app-section-card title="Documents per month" description="Monthly accounting document volume." icon="calendar_month">
      <div class="relative min-h-72"><canvas id="documentPerMonthChart"></canvas></div>
    </app-section-card>

    <app-section-card title="Documents by source" description="Distribution of documents across accounting sources." icon="source">
      <div class="relative min-h-72"><canvas id="sourcePieChart"></canvas></div>
    </app-section-card>

    <app-section-card title="Documents by type" description="Distribution of documents across document types." icon="description">
      <div class="relative min-h-72"><canvas id="documentTypeChart"></canvas></div>
    </app-section-card>
  </div>
</div>
