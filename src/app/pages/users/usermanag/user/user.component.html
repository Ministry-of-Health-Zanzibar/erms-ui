<div class="p-10 space-y-8" *ngIf="permission.parmissionMatched(['View User'])">
  <app-page-header title="Users" description="Manage system users, hospital assignments, and account access." icon="group" />
  <app-section-card title="User records" description="Search and maintain user profiles and account status." icon="manage_accounts">
      <app-table-toolbar>
        <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
          <div
            class="size-9 rounded-full border bg-surface flex flex items-center justify-center"
            (click)="renew()"
            matTooltip="Refresh"
          >
            <mat-icon class="font-icon visibilityData">refresh</mat-icon>
          </div>
          <emr-v-divider></emr-v-divider>
          <input
            type="text"
            placeholder="Search..."
            class="border-b h-10 w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950"
            matInput
            (keyup)="applyFilter($event)"
            #input
          />
        </div>
        <div uiToolbarActions>
          <button
            mat-flat-button
            (click)="addUser()"
            *ngIf="permission.parmissionMatched(['Create User'])"
          >
            <mat-icon class="font-icon">add</mat-icon>Add User
          </button>
        </div>
      </app-table-toolbar>

      <div class="border dark:border-inverse rounded-lg overflow-x-auto">
        <table mat-table [dataSource]="dataSource" class="not-prose">
          <!-- Position Column -->
          <ng-container matColumnDef="id">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              No.
            </th>
            <td mat-cell *matCellDef="let element; let i = index">
              {{ i + 1 }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Full Name
            </th>
            <td mat-cell *matCellDef="let element">
              {{
                element.first_name +
                  " " +
                  element.middle_name +
                  " " +
                  element.last_name
              }}
            </td>
          </ng-container>

          <ng-container matColumnDef="gender">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Gender
            </th>
            <td mat-cell *matCellDef="let element">{{ element.gender }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="address">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Address
            </th>
            <td mat-cell *matCellDef="let element">{{ element.address }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="phone">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Phone Number
            </th>
            <td mat-cell *matCellDef="let element">{{ element.phone_no }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="email">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Email
            </th>
            <td mat-cell *matCellDef="let element">{{ element.email }}</td>
          </ng-container>

          <!-- <ng-container matColumnDef="hospital">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Hospital
            </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented theme="simple" class="-mx-2">
                <emr-segmented-button value="assign_hospital">
                  <button
                    mat-raised-button
                    color="accent"
                    (click)="addPatient(element.id)"
                    matTooltip="Assign / Add Hospital"
                    *ngIf="element.role_name === 'ROLE HOSPITAL USER'"
                    class="flex items-center gap-1"
                  >
                    <mat-icon>local_hospital</mat-icon>
                  </button>
                </emr-segmented-button>
              </emr-segmented>
            </td>
          </ng-container> -->

          <ng-container matColumnDef="hospital">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Hospital
            </th>

            <td mat-cell *matCellDef="let element">
              
              <ng-container *ngIf="!element.hospital; else assignedHospital">
                <span class="text-neutral-400 italic">N/A</span>

                <button
                  mat-raised-button
                  color="accent"
                  class="ml-2 flex items-center gap-1"
                  *ngIf="
                    element.role_name === 'ROLE HOSPITAL USER' ||
                    element.role_name === 'ROLE MEDICAL BOARD MEMBER'
                  "
                  (click)="addPatient(element.id)"
                  matTooltip="Assign Hospital"
                >
                  <mat-icon>add</mat-icon>
                </button>
              </ng-container>

              <ng-template #assignedHospital>
                <span class="font-medium text-primary-700">
                  {{ element.hospital }}
                </span>
              </ng-template>
            </td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="action">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Action
            </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented theme="simple" class="-mx-2">
                <emr-segmented-button value="edit_squareData">
                  <span
                    class="size-9 rounded-full border bg-surface flex items-center justify-center"
                    (click)="updateUser(element)"
                    *ngIf="permission.parmissionMatched(['Update User'])"
                    matTooltip="Edit"
                  >
                    <mat-icon class="font-icon edit_squareData"
                      >edit_square</mat-icon
                    >
                  </span>
                </emr-segmented-button>
                <emr-segmented-button value="edit_squareData">
                  <mat-slide-toggle
                    [checked]="!element.deleted_at"
                    (toggleChange)="blockUser(element.id, element.deleted_at)"
                    color="primary"
                    *ngIf="permission.parmissionMatched(['Update User'])"
                  >
                  </mat-slide-toggle>
                </emr-segmented-button>

              <emr-segmented-button value="reset_password">
              <button
                mat-icon-button
                color="primary"
                matTooltip="Reset Password"
                (click)="resetUserPassword(element.id)"
                *ngIf="permission.parmissionMatched(['Update User'])"
              >
                <mat-icon class="material-symbols-outlined">
                  lock_reset
                </mat-icon>
              </button>
        </emr-segmented-button>


              </emr-segmented>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell tablefoter" colspan="8">
              <app-empty-state title="No users found" [message]="input.value ? 'No users match your search.' : 'User records will appear here.'" icon="group" />
            </td>
          </tr>
        </table>
        <mat-paginator
          [pageSizeOptions]="[10, 20]"
          showFirstLastButtons
          aria-label="Select page of permission"
          class="pt-3"
        >
        </mat-paginator>
      </div>
  </app-section-card>
</div>
