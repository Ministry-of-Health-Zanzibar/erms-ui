<div class="ui-form-dialog">
  <app-form-header
    eyebrow="User administration"
    title="Role permissions"
    description="Review the permissions assigned to this role."
    icon="verified_user"
  />

  <div class="ui-form-dialog__body">

      <div class="font-bold mb-2 mt-4 pb-2.5 border-b-2 border-sky-500">
        Role Name: <span style="color: green;">{{roleName}} </span>
      </div>

  <form [formGroup]="diplayRoleForm">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <ng-container *ngFor="let item of filteredChecklist; let i = index" class="permission">
        <mat-checkbox color="primary" [checked]="item.isSelected">
          {{item.name}}
        </mat-checkbox>
      </ng-container>
    </div>
  </form>


  </div>

  <mat-dialog-actions align="end" class="ui-form-dialog__actions">
  <mat-form-field appFormField appearance="outline" subscriptSizing="dynamic" class="ui-form-field--filter w-full">
    <mat-label>Search permisssion</mat-label>
    <input type="text" placeholder="Search permisssion..." matInput (input)="applyFilter($event)">
  </mat-form-field>
</mat-dialog-actions>
</div>
