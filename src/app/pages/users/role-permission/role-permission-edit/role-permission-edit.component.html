<div class="ui-form-dialog">
  <app-form-header
    eyebrow="User administration"
    title="Update role"
    description="Update the role name and its permissions."
    icon="admin_panel_settings"
  />

  <div class="ui-form-dialog__body">

    <form [formGroup]="editRoleForm">
      <mat-form-field appFormField class="w-full mt-6">
        <mat-label>Edit Role Name</mat-label>
        <input matInput placeholder="Ex. Administration" formControlName="name" type="text">
        <mat-error class="error-message" *ngIf="editRoleForm.controls.name.touched && editRoleForm.controls.name.invalid">
          <span *ngIf="editRoleForm.controls.name.errors.required">This field is mandatory</span>
          <span *ngIf="editRoleForm.controls.name.errors.pattern">Only alphabetical characters are allowed</span>
        </mat-error>
      </mat-form-field>

      <div class="mt-4 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <div class="text-sm uppercase">
            <mat-checkbox class="me-3" (change)="checkUncheckAll($event)">Check/Uncheck All Permission</mat-checkbox>
          </div>
        </div>
        <div class="text-sm">
          <mat-form-field appFormField appearance="outline" subscriptSizing="dynamic" class="ui-form-field--filter w-full md:w-96">
            <mat-label>Search</mat-label>
            <input type="text" placeholder="Search..." matInput (input)="applyFilter($event)">
          </mat-form-field>
        </div>
      </div>
    </form>

  <form [formGroup]="editRoleForm">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <ng-container *ngFor="let item of filteredChecklist; let i = index" class="permission" formArrayName="permissionName">
        <mat-checkbox color="primary" [checked]="item.isSelected" (change)="onCheckboxChange(item.id, $event)">
          {{item.name}}
        </mat-checkbox>
      </ng-container>
    </div>
  </form>


  </div>

  <mat-dialog-actions align="end" class="ui-form-dialog__actions">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button cdkFocusInitial [disabled]="editRoleForm.invalid || submitting" (click)="editRolePermission()">{{ submitting ? 'Updating…' : 'Update Data' }}</button>
</mat-dialog-actions>
</div>
