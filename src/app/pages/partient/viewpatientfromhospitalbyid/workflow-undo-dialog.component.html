<section class="undo-dialog" aria-labelledby="workflow-undo-title">
  <app-form-header
    eyebrow="Super Admin control"
    title="Undo workflow transition"
    description="Restore this case to the state before {{ data?.action || 'the selected transition' }}."
    icon="history"
    titleId="workflow-undo-title"
  />

  <div class="undo-dialog__notice" role="note">
    <mat-icon aria-hidden="true">warning</mat-icon>
    <span>Related workflow records are restored together. This action is recorded in the audit log.</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="undo-dialog__field">
      <mat-label>Reason for undo</mat-label>
      <textarea
        matInput
        rows="5"
        maxlength="2000"
        formControlName="reason"
        placeholder="Explain why this transition must be reversed..."
      ></textarea>
      <mat-hint>Provide enough detail for the audit trail.</mat-hint>
      <mat-hint align="end">{{ reasonLength }}/2000</mat-hint>
      <mat-error *ngIf="form.controls.reason.hasError('required')">An undo reason is required.</mat-error>
      <mat-error *ngIf="form.controls.reason.hasError('minlength')">Use at least 5 characters.</mat-error>
    </mat-form-field>

    <footer class="undo-dialog__actions">
      <button mat-stroked-button type="button" (click)="cancel()">
        <mat-icon aria-hidden="true">close</mat-icon>
        Cancel
      </button>
      <button mat-flat-button color="warn" type="submit" [disabled]="form.invalid">
        <mat-icon aria-hidden="true">undo</mat-icon>
        Undo transition
      </button>
    </footer>
  </form>
</section>
