<div
  class="p-4 md:p-10 space-y-6 md:space-y-8"
  *ngIf="permission.parmissionMatched(['View Patient List'])"
>
  <app-page-header
    title="Medical boards"
    description="Manage medical board sessions and assigned patient lists."
    icon="groups"
  />

  <app-section-card
    title="Medical board records"
    description="Search existing boards or create a new medical board."
    icon="clinical_notes"
  >
      <app-table-toolbar>
        <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
          <div
            class="size-9 rounded-full border bg-surface flex flex items-center justify-center"
            (click)="renew()"
            matTooltip="Refresh"
          >
            <mat-icon class="font-icon visibilityData">refresh</mat-icon>
          </div>
          <emr-v-divider></emr-v-divider>
          <input
            type="text"
            placeholder="Search..."
            class="border-b h-10 w-full md:w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950"
            matInput
            (keyup)="applyFilter($event)"
            #input
          />
        </div>
        <div uiToolbarActions>
        <button
          mat-flat-button
          class="w-full md:w-auto"
          (click)="addPatient()"
          *ngIf="permission.parmissionMatched(['Create Patient List'])"
        >

            <mat-icon class="font-icon">add</mat-icon>Add Medical Board
          </button>
        </div>
      </app-table-toolbar>

      <div class="border dark:border-inverse rounded-lg overflow-x-auto">

        <table mat-table [dataSource]="dataSource" class="not-prose min-w-[900px] md:min-w-full">

          <!-- Position Column -->
          <ng-container matColumnDef="id">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              No.
            </th>
            <td mat-cell *matCellDef="let element; let i = index">
              {{ i + 1 }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="reference_number">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              References No
            </th>
            <td mat-cell *matCellDef="let element">
              {{ element.reference_number | uppercase }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="board_type">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Board_type
            </th>
            <td mat-cell *matCellDef="let element">
              {{ element.board_type | uppercase }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="no_of_patients">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              No_of_patients
            </th>
            <td mat-cell *matCellDef="let element">
              {{ element.no_of_patients }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="pdf">
            <th mat-header-cell *matHeaderCellDef>View PDF</th>
            <td mat-cell *matCellDef="let element">
              <a
                *ngIf="element?.patient_list_file"
                (click)="viewPDF(element)"
                class="inline-flex items-center gap-1 text-indigo-600 hover:text-indigo-800 cursor-pointer"
              >
                <mat-icon>picture_as_pdf</mat-icon> View PDF
              </a>
            </td>
          </ng-container>


          <!-- Weight Column -->
          <ng-container matColumnDef="action">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Action
            </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented theme="simple" class="-mx-2">
                <emr-segmented-button value="edit_squareData">
                  <span
                    class="size-9 rounded-full border bg-surface flex items-center justify-center"
                    (click)="updatePatient(element)"
                    *ngIf="
                      permission.parmissionMatched(['Update Patient List'])
                    "
                    matTooltip="Edit"
                  >
                    <mat-icon class="font-icon edit_squareData"
                      >edit_square</mat-icon
                    >
                  </span>
                </emr-segmented-button>

                <emr-segmented-button value="edit_squareData">
                  <mat-slide-toggle
                    [checked]="!element.deleted_at"
                    (change)="confirmBlock(element)"
                    color="primary"
                  >
                  </mat-slide-toggle>
                </emr-segmented-button>
              </emr-segmented>
            </td>
          </ng-container>
          <ng-container matColumnDef="action2">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              View
            </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented theme="simple" class="-mx-2">
                <emr-segmented-button value="edit_squareData">
              

                  <span
                    class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
                    (click)="displayMoreData(element)"
                    matTooltip="View"
                  >
                    <mat-icon class="font-icon">visibility</mat-icon>
                  </span>
                </emr-segmented-button>
              </emr-segmented>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell tablefoter" colspan="10">
              <app-empty-state
                title="No medical boards found"
                [message]="input.value ? 'No medical boards match your search.' : 'Medical board records will appear here.'"
                icon="groups"
              />
            </td>
          </tr>
        </table>
        <mat-paginator
        [pageSizeOptions]="[10, 20, 50]"
        showFirstLastButtons
      >
      </mat-paginator>
      </div>
  </app-section-card>

  <app-loading-state
    *ngIf="loading"
    label="Loading medical boards…"
    [overlay]="true"
  />
</div>
