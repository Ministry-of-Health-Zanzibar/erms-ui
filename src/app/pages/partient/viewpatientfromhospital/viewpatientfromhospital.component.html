<div
  class="p-4 md:p-10 space-y-6 md:space-y-8"
  *ngIf="permission.parmissionMatched(['View Patient History'])"
>
  <app-page-header title="Hospital Patients" description="Review patients and their latest hospital referral history." icon="local_hospital" />
  <app-section-card title="Patient records" description="Search patients received from hospitals and open their latest history." icon="clinical_notes">
      <app-table-toolbar>
        <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
          <div
            class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
            (click)="renew()"
            matTooltip="Refresh"
          >
            <mat-icon class="font-icon">refresh</mat-icon>
          </div>
          <input
            type="text"
            placeholder="Search..."
            class="border-b h-10 w-full md:w-96 text-sm bg-transparent outline-0 focus-within:border-neutral-950"
            (input)="applyFilter($event)"
            #input
          />
        </div>
      </app-table-toolbar>

      <div *ngIf="errorMessage" class="mb-4 flex items-center justify-between gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800 dark:border-red-900/60 dark:bg-red-950/30 dark:text-red-200" role="alert">
        <span>{{ errorMessage }}</span>
        <button mat-stroked-button type="button" (click)="loadPatients()">Retry</button>
      </div>

      <div class="border rounded-lg overflow-x-auto">
        <table
          mat-table
          [dataSource]="dataSource"
          matSort
          class="min-w-[900px] md:min-w-full"
        >
          <!-- No. Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element; let i = index">
              {{ i + 1 }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <!-- Matibabu Card Column -->
          <ng-container matColumnDef="matibabu_card">
            <th mat-header-cell *matHeaderCellDef>Matibabu Card</th>
            <td mat-cell *matCellDef="let element">
              {{ element.matibabu_card || "N/A" }}
            </td>
          </ng-container>

          <!-- Phone Column -->
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
          </ng-container>

          <ng-container matColumnDef="hospital">
            <th mat-header-cell *matHeaderCellDef>Hospital</th>
            <td mat-cell *matCellDef="let element">
              {{ element.hospital || "N/A" }}
            </td>
          </ng-container>

          <!-- Date of Birth Column -->
          <ng-container matColumnDef="case_type">
            <th mat-header-cell *matHeaderCellDef>Case Type</th>
            <td mat-cell *matCellDef="let element">
              {{ element.latest_history?.case_type || "N/A" }}
            </td>
          </ng-container>

          <!-- Gender Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let p">
              <app-status-badge [status]="p.latest_history?.status" />
            </td>
          </ng-container>

          <!-- <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let element">{{ element.latest_history?.status }}</td>
            </ng-container> -->

          <!-- <ng-container matColumnDef="patient_file">
              <th mat-header-cell *matHeaderCellDef>View PDF</th>
              <td mat-cell *matCellDef="let element">
                <a
                  *ngIf="element?.files?.length > 0"
                  (click)="viewPDF(element.files[0])"
                  class="inline-flex items-center gap-1 text-indigo-600 hover:text-indigo-800 cursor-pointer"
                >
                  <mat-icon>picture_as_pdf</mat-icon> View PDF
                </a>
              </td>
            </ng-container> -->

          <!-- Action Column -->
          <ng-container matColumnDef="action">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Action
            </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented
                theme="simple"
                class="-mx-2 flex items-center gap-2"
              >
                <!-- Edit button -->
                <emr-segmented-button value="edit_squareData">
                  <span
                    class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
                    (click)="displayMoreData(element)"
                    matTooltip="View"
                  >
                    <mat-icon class="font-icon">visibility</mat-icon>
                  </span>
                </emr-segmented-button>

                <!-- Toggle button -->
              </emr-segmented>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="8">
              <app-empty-state title="No hospital patients found" [message]="input.value ? 'No patients match your search.' : 'Hospital patient records will appear here.'" icon="local_hospital" />
            </td>
          </tr>
        </table>

        <mat-paginator
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageIndex]="currentPage - 1"
          [pageSizeOptions]="[10, 25, 50]"
          showFirstLastButtons
          (page)="pageChanged($event)"
        >
        </mat-paginator>

        <!-- <mat-paginator
            [pageSizeOptions]="[10, 20]"
            showFirstLastButtons
          ></mat-paginator> -->
      </div>
  </app-section-card>

  <app-loading-state *ngIf="loading" label="Loading hospital patients…" [overlay]="true" />
</div>
