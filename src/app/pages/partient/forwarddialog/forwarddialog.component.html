<section class="forward-dialog" aria-labelledby="forward-dialog-title">
  <app-form-header
    eyebrow="{{ isEditMode ? 'Workflow note' : 'Case handover' }}"
    [title]="isEditMode ? 'Review forwarding note' : 'Forward case for review'"
    description="{{ isEditMode ? 'Review or update the note attached to this case.' : 'Add a concise handover note for the next responsible reviewer.' }}"
    icon="forward_to_inbox"
    titleId="forward-dialog-title"
  />

  <div class="forward-dialog__body">
    <div class="forward-dialog__notice" role="note">
      <mat-icon aria-hidden="true">info</mat-icon>
      <span>This note will be recorded in the case history and shared with the next workflow level.</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appFormField appearance="outline" class="forward-dialog__field">
        <mat-label>Handover note</mat-label>
        <textarea
          matInput
          rows="5"
          maxlength="1000"
          formControlName="mkurugenzi_tiba_comments"
          placeholder="Summarize the relevant context, action taken, or recommendation..."
          aria-describedby="forward-note-help"
        ></textarea>
        <mat-hint id="forward-note-help">Keep the note clear and relevant to the next reviewer.</mat-hint>
        <mat-hint align="end">{{ commentLength }}/1000</mat-hint>
        <mat-error *ngIf="form.controls['mkurugenzi_tiba_comments'].hasError('required')">
          A handover note is required before forwarding.
        </mat-error>
      </mat-form-field>

      <footer class="forward-dialog__actions">
        <button mat-stroked-button type="button" (click)="close()">
          <mat-icon aria-hidden="true">close</mat-icon>
          <span>Cancel</span>
        </button>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="loading || form.invalid"
        >
          <mat-icon aria-hidden="true">{{ isEditMode ? 'save' : 'forward_to_inbox' }}</mat-icon>
          <span>{{ isEditMode ? 'Save note' : 'Forward case' }}</span>
        </button>
      </footer>
    </form>
  </div>
</section>
