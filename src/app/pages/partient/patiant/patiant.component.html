<div
  class="p-10 space-y-8"
  *ngIf="permission.parmissionMatched(['View Patient'])"
>
  <app-page-header title="Patients" description="Manage patient records and review their referral history." icon="personal_injury" />
  <app-section-card title="Patient records" description="Search, add, update, and review registered patients." icon="patient_list">
      <app-table-toolbar>
        <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
          <div
            class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
            (click)="renew()"
            matTooltip="Refresh"
          >
            <mat-icon class="font-icon">refresh</mat-icon>
          </div>
          <input
            type="text"
            placeholder="Search..."
            class="border-b h-10 w-96 text-sm bg-transparent outline-0 focus-within:border-neutral-950"
            (keyup)="applyFilter($event)"
            #input
          />
        </div>

        <div uiToolbarActions>
          <button
            mat-flat-button
            (click)="addPatient()"
            *ngIf="permission.parmissionMatched(['Create Patient'])"
          >
            <mat-icon>add</mat-icon> Add Patient
          </button>
        </div>
      </app-table-toolbar>

      <div class="border rounded-lg overflow-x-auto">
        <table mat-table [dataSource]="dataSource" matSort class="min-w-[900px] md:min-w-full">
          <!-- No. Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element; let i = index">
              {{ i + 1 }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <!-- Matibabu Card Column -->
          <ng-container matColumnDef="matibabu_card">
            <th mat-header-cell *matHeaderCellDef>Matibabu Card</th>
            <td mat-cell *matCellDef="let element">
              {{ element.matibabu_card || "N/A" }}
            </td>
          </ng-container>

          <!-- ZanID  Column -->
          <ng-container matColumnDef="zan_id">
            <th mat-header-cell *matHeaderCellDef>Zan ID</th>
            <td mat-cell *matCellDef="let element">
              {{ element.zan_id || "N/A" }}
            </td>
          </ng-container>

          <!-- Date of Birth Column -->
          <ng-container matColumnDef="date_of_birth">
            <th mat-header-cell *matHeaderCellDef>Date of Birth / Age</th>
            <td mat-cell *matCellDef="let element">
              {{ element.date_of_birth }}
            </td>
          </ng-container>

          <!-- Gender Column -->
          <ng-container matColumnDef="gender">
            <th mat-header-cell *matHeaderCellDef>Gender</th>
            <td mat-cell *matCellDef="let element">{{ element.gender }}</td>
          </ng-container>

          <!-- Phone Column -->
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
          </ng-container>

          <!-- <ng-container matColumnDef="patient_file">
              <th mat-header-cell *matHeaderCellDef>View PDF</th>
              <td mat-cell *matCellDef="let element">
                <a
                  *ngIf="element?.files?.length > 0"
                  (click)="viewPDF(element.files[0])"
                  class="inline-flex items-center gap-1 text-indigo-600 hover:text-indigo-800 cursor-pointer"
                >
                  <mat-icon>picture_as_pdf</mat-icon> View PDF
                </a>
              </td>
            </ng-container> -->

          <!-- Action Column -->
          <ng-container matColumnDef="action">
            <th
              mat-header-cell
              *matHeaderCellDef
              class="text-neutral-500 dark:text-neutral-400"
            >
              Action
            </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented
                theme="simple"
                class="-mx-2 flex items-center gap-2"
              >
                <emr-segmented-button value="toggle_status">
                  <mat-slide-toggle
                    [checked]="!element.deleted_at"
                    (change)="confirmBlock(element)"
                    color="primary"
                  >
                  </mat-slide-toggle>
                </emr-segmented-button>
                <!-- Edit button -->
                <emr-segmented-button value="edit_squareData">
                  <span
                    class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer hover:bg-gray-100 transition"
                    (click)="updatePatient(element)"
                    *ngIf="permission.parmissionMatched(['Update Patient'])"
                    matTooltip="Edit"
                  >
                    <mat-icon class="font-icon edit_squareData"
                      >edit_square</mat-icon
                    >
                  </span>

                  <span
                    class="size-9 rounded-full border bg-surface flex items-center justify-center cursor-pointer"
                    (click)="displayMoreData(element)"
                    matTooltip="View"
                  >
                    <mat-icon class="font-icon">visibility</mat-icon>
                  </span>
                </emr-segmented-button>

                <!-- Toggle button -->
              </emr-segmented>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="8">
              <app-empty-state title="No patients found" [message]="input.value ? 'No patients match your search.' : 'Patient records will appear here.'" icon="personal_injury" />
            </td>
          </tr>
        </table>

        <!-- <mat-paginator
            [pageSizeOptions]="[10, 20]"
            showFirstLastButtons
          ></mat-paginator> -->

        <mat-paginator
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageIndex]="currentPage - 1"
          showFirstLastButtons
          (page)="pageChanged($event)"
        >
        </mat-paginator>
      </div>
  </app-section-card>

  <app-loading-state *ngIf="loading" label="Loading patients…" [overlay]="true" />
</div>
