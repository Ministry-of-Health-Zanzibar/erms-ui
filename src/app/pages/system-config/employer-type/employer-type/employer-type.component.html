<div class="p-10 space-y-8" *ngIf="permission.parmissionMatched(['View Employer Type'])">
  <app-page-header title="Employer Types" description="Manage the classifications used to group employers." icon="category" />
  <app-section-card title="Employer type records" description="Search and maintain employer classifications." icon="account_tree">
      <app-table-toolbar>
        <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
          <div class="size-9 rounded-full border bg-surface flex flex items-center justify-center" (click)="renew()" matTooltip="Refresh">
            <mat-icon class="font-icon visibilityData">refresh</mat-icon>
          </div>
          <emr-v-divider></emr-v-divider>
          <input type="text" placeholder="Search..."
                 class="border-b h-10 w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950" matInput (keyup)="applyFilter($event)" #input>
        </div>
        <div uiToolbarActions class="flex">
          <button mat-flat-button (click) = "addEmployerType()"  *ngIf="permission.parmissionMatched(['Create Employer Type'])">
            <mat-icon class="font-icon">add</mat-icon>Add New
          </button>
        </div>
      </app-table-toolbar>

      <div class="border dark:border-inverse rounded-lg overflow-x-auto">
        <table mat-table [dataSource]="dataSource" class="not-prose">
          <!-- Position Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> No. </th>
            <td mat-cell *matCellDef="let element,let i = index"> {{i+1}} </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Employer Type Name </th>
            <td mat-cell *matCellDef="let element,"> {{element.employer_type_name}} </td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Action </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented theme="simple" class="-mx-2">
                <emr-segmented-button value="edit_squareData">
                  <span class="size-9 rounded-full border bg-surface flex items-center justify-center" (click)="updateEmployerType(element.employer_type_id)" *ngIf="permission.parmissionMatched(['Update Employer Type'])" matTooltip="Edit">
                    <mat-icon class="font-icon edit_squareData">edit_square</mat-icon>
                  </span>
                </emr-segmented-button>
                <emr-segmented-button value="edit_squareData">
                  <mat-slide-toggle
                  [checked]="!element.deleted_at"
                  (toggleChange)="comfirmBlock(element)"
                  color="primary"
                  *ngIf="permission.parmissionMatched(['Update Employer Type'])">
                </mat-slide-toggle>
                </emr-segmented-button>
              </emr-segmented>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell tablefoter" colspan="3">
              <app-empty-state title="No employer types found" [message]="input.value ? 'No employer types match your search.' : 'Employer type records will appear here.'" icon="category" />
            </td>
          </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                       showFirstLastButtons
                       aria-label="Select page of country" class="pt-3">
        </mat-paginator>
      </div>
  </app-section-card>
</div>
