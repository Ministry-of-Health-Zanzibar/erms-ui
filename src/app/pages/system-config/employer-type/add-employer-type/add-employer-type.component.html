<div class="ui-form-dialog">
  <app-form-header
    eyebrow="System configuration"
    [title]="id ? 'Update employer type' : 'Create employer type'"
    description="Manage classifications for patient employers."
    icon="category"
  />

  <div class="ui-form-dialog__body">
      <form [formGroup]="employerTypeForm">
        <mat-form-field class="w-full mt-6">
          <mat-label>Employer Type Name</mat-label>
          <input matInput placeholder="Ex. private" formControlName="employer_type_name" type="text">
          <mat-error class="error-message" *ngIf="employerTypeForm.controls['employer_type_name'].touched && employerTypeForm.controls['employer_type_name'].invalid">
            <span *ngIf="employerTypeForm.controls['employer_type_name'].errors?.['required']">This field is mandatory</span>
            <span *ngIf="employerTypeForm.controls['employer_type_name'].errors?.['pattern']">This field is invalid (must be contain alpharbetical only)</span>
          </mat-error>
        </mat-form-field>
      </form>
  </div>

  <mat-dialog-actions align="end" class="ui-form-dialog__actions">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button *ngIf="!id" cdkFocusInitial [disabled]="employerTypeForm.invalid || submitting" (click)="saveEmployerType()">{{ submitting ? 'Saving...' : 'Save Employer Type' }}</button>
    <button mat-flat-button *ngIf="id" cdkFocusInitial [disabled]="employerTypeForm.invalid || submitting" (click)="updateEmployerType()">{{ submitting ? 'Saving...' : 'Update Employer Type' }}</button>
  </mat-dialog-actions>
</div>
