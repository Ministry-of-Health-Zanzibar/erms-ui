<div class="p-10 space-y-8" *ngIf="permission.parmissionMatched(['View Bill'])">
    <app-page-header title="Bills" description="Manage referral billing records and supporting files." icon="receipt_long" />
    <app-section-card title="Bill records" description="Search and maintain bills submitted for referrals." icon="request_quote">
        <app-table-toolbar>
          <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
            <div class="size-9 rounded-full border bg-surface flex flex items-center justify-center" (click)="renew()" matTooltip="Refresh">
              <mat-icon class="font-icon visibilityData">refresh</mat-icon>
            </div>
            <emr-v-divider></emr-v-divider>
            <input type="text" placeholder="Search..."
                   class="border-b h-10 w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950" matInput (keyup)="applyFilter($event)" #input>
          </div>
          <div uiToolbarActions class="flex space-x-2">
            <button mat-flat-button (click) = "addBill()"  *ngIf="permission.parmissionMatched(['Create Bill'])">
              <mat-icon class="font-icon">add</mat-icon>Add Bill
            </button>
            </div>
        </app-table-toolbar>
  
        <div class="border dark:border-inverse rounded-lg overflow-x-auto">
          <table mat-table [dataSource]="dataSource" class="not-prose">
            <!-- Position Column -->
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> No. </th>
              <td mat-cell *matCellDef="let element,let i = index"> {{i+1}} </td>
            </ng-container>
  
            <!-- Name Column -->
            <ng-container matColumnDef="referral_id">
              <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Referral Id  </th>
              <td mat-cell *matCellDef="let element,"> {{element.referral_id}} </td>
            </ng-container>
  
  
            <!-- Name Column -->
            <ng-container matColumnDef="amount">
              <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Amount  </th>
              <td mat-cell *matCellDef="let element,"> {{element.amount}} </td>
            </ng-container>
             <!-- Name Column -->
             <ng-container matColumnDef="notes">
              <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Notes </th>
              <td mat-cell *matCellDef="let element,"> {{element.notes}} </td>
            </ng-container>
             <!-- Name Column -->
             <ng-container matColumnDef="sent_to">
              <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Sent To  </th>
              <td mat-cell *matCellDef="let element,"> {{element.sent_to}} </td>
            </ng-container>
             <!-- Name Column -->
             <ng-container matColumnDef="bill_file">
                <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Bill File </th>
                <td mat-cell *matCellDef="let element,"> {{element.bill_file}} </td>
              </ng-container>
    
  
            <!-- Weight Column -->
            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Action </th>
              <td mat-cell *matCellDef="let element">
                <emr-segmented theme="simple" class="-mx-2">
                  <emr-segmented-button *ngIf="!element.deleted_at" value="edit_squareData">
                    <span class="size-9 rounded-full border bg-surface flex items-center justify-center" (click)="updateBill(element.bill_id)" *ngIf="permission.parmissionMatched(['Update Bill'])" matTooltip="Edit">
                      <mat-icon class="font-icon edit_squareData">edit_square</mat-icon>
                    </span>
                  </emr-segmented-button>
                  <emr-segmented-button value="edit_squareData">
                    <mat-slide-toggle
                      [checked]="!element.deleted_at"
                      (toggleChange)="confirmBlock(element)"
                      color="primary">
                    </mat-slide-toggle>
                  </emr-segmented-button>
                </emr-segmented>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell tablefoter" colspan="7">
                <app-empty-state title="No bills found" [message]="input.value ? 'No bills match your search.' : 'Bill records will appear here.'" icon="receipt_long" />
              </td>
            </tr>
          </table>
          <mat-paginator [pageSizeOptions]="[10, 20]"
                         showFirstLastButtons
                         aria-label="Select page of country" class="pt-3">
          </mat-paginator>
        </div>
    </app-section-card>
  </div>
