<div
  class="p-10 space-y-8 bg-gray-50 dark:bg-gray-900 min-h-screen"
  *ngIf="permission.parmissionMatched(['View Diagnoses'])"
>
  <app-page-header title="Diagnoses" description="Manage the clinical diagnoses available throughout the system." icon="diagnosis" />

  <app-section-card title="Diagnosis records" description="Search, import, add, block, or restore diagnosis records." icon="medical_information">

    <app-table-toolbar>
      <!-- Left: Search -->
      <div uiToolbarPrimary class="flex items-center gap-3 w-full md:w-auto">
        <button
          (click)="renew()"
          mat-icon-button
          matTooltip="Refresh"
          class="border border-gray-300 dark:border-gray-600 rounded-full p-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition"
        >
          <mat-icon>refresh</mat-icon>
        </button>

        <input
          type="text"
          placeholder="🔍 Search diagnosis..."
          class="border-b h-10 w-80 text-sm bg-transparent dark:border-b-gray-500 outline-none focus:border-blue-500 px-2 transition"
          matInput
          (keyup)="applyFilter($event)"
          #input
        />
      </div>

      <!-- Right: Buttons -->
      <div uiToolbarActions class="flex flex-wrap gap-3 justify-end">
        <!-- Download Button -->
        <button
          mat-stroked-button
          color="primary"
          class="!border-blue-500 !text-blue-600 hover:!bg-blue-50 flex items-center gap-2"
          (click)="downloadFile('diagnosis.xlsx')"
          *ngIf="permission.parmissionMatched(['Create Diagnoses'])"
        >
          <mat-icon>download</mat-icon>
          Download
        </button>

        <!-- Upload Button -->
        <button
          (click)="uploadFile()"
          class="bg-teal-600 hover:bg-teal-700 text-white text-sm py-2 px-4 rounded-lg flex items-center gap-2 shadow"
          *ngIf="permission.parmissionMatched(['Create Diagnoses'])"
        >
          <mat-icon>publish</mat-icon>
          Upload
        </button>

        <!-- Add Diagnosis -->
        <button
          mat-flat-button
          color="accent"
          class="bg-green-600 hover:bg-green-700 text-white rounded-lg flex items-center gap-2 shadow"
          (click)="addDiagnosis()"
          *ngIf="permission.parmissionMatched(['Create Diagnoses'])"
        >
          <mat-icon>add</mat-icon>
          Add Diagnosis
        </button>
      </div>
    </app-table-toolbar>

    <!-- Table Section -->
    <div
      class="border dark:border-gray-700 rounded-lg overflow-x-auto shadow-sm bg-white dark:bg-gray-800"
    >
      <table mat-table [dataSource]="dataSource" class="w-full text-sm">
        <!-- Index -->
        <ng-container matColumnDef="id">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="text-gray-600 dark:text-gray-300 font-semibold"
          >
            #
          </th>
          <td mat-cell *matCellDef="let element; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <!-- Code -->
        <ng-container matColumnDef="code">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="text-gray-600 dark:text-gray-300 font-semibold"
          >
            Code
          </th>
          <td mat-cell *matCellDef="let element">
            {{ element.diagnosis_code }}
          </td>
        </ng-container>

        <!-- Diagnosis Name -->
        <ng-container matColumnDef="name">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="text-gray-600 dark:text-gray-300 font-semibold"
          >
            Diagnosis Name
          </th>
          <td mat-cell *matCellDef="let element">
            {{ element.diagnosis_name }}
          </td>
        </ng-container>
        <!-- Weight Column -->
        <ng-container matColumnDef="action">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="text-neutral-500 dark:text-neutral-400"
          >
            Action
          </th>
          <td mat-cell *matCellDef="let element">
            <mat-slide-toggle
              [checked]="!element.deleted_at"
              (toggleChange)="confirmBlock(element)"
              color="primary"
            >
            </mat-slide-toggle>
          </td>
        </ng-container>

        <!-- Table Rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- No Data -->
        <tr class="mat-row" *matNoDataRow>
          <td
            class="mat-cell text-center py-4 text-gray-500 dark:text-gray-400"
            colspan="10"
          >
            <app-empty-state title="No diagnoses found" [message]="input.value ? 'No diagnoses match your search.' : 'Diagnosis records will appear here.'" icon="medical_information" />
          </td>
        </tr>
      </table>

  
      <mat-paginator
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageIndex]="currentPage - 1"
        showFirstLastButtons
        (page)="pageChanged($event)"
      >
      </mat-paginator>
    </div>
  </app-section-card>
</div>
