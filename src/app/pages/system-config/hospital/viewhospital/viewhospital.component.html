<div class="p-10 space-y-8" *ngIf="permission.parmissionMatched(['View Hospital'])">
  <app-page-header title="Hospitals" description="Manage hospitals participating in referral and billing workflows." icon="local_hospital" />
  <app-section-card title="Hospital directory" description="Search, add, edit, block, or restore hospital records." icon="apartment">
      <app-table-toolbar>
        <div uiToolbarPrimary class="flex items-center gap-1.5 w-full">
          <div class="size-9 rounded-full border bg-surface flex flex items-center justify-center" (click)="renew()" matTooltip="Refresh">
            <mat-icon class="font-icon visibilityData">refresh</mat-icon>
          </div>
          <emr-v-divider></emr-v-divider>
          <input type="text" placeholder="Search..."
                 class="border-b h-10 w-96 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950" matInput (keyup)="applyFilter($event)" #input>
        </div>
        <div uiToolbarActions class="flex space-x-2">
          <button mat-flat-button (click) = "addHospital()"  *ngIf="permission.parmissionMatched(['Create Hospital'])">
            <mat-icon class="font-icon">add</mat-icon>Add Hospital
          </button>
          </div>
      </app-table-toolbar>

      <div class="border dark:border-inverse rounded-lg overflow-x-auto">
        <table mat-table [dataSource]="dataSource" class="not-prose">
          <!-- Position Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> No. </th>
            <td mat-cell *matCellDef="let element,let i = index"> {{i+1}} </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Hospital Name </th>
            <td mat-cell *matCellDef="let element,"> {{element.hospital_name}} </td>
          </ng-container>


          <!-- Name Column -->
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Hospital Code </th>
            <td mat-cell *matCellDef="let element,"> {{element.hospital_code}} </td>
          </ng-container>
           <!-- Name Column -->
           <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Hospital Address </th>
            <td mat-cell *matCellDef="let element,"> {{element.hospital_address}} </td>
          </ng-container>
           <!-- Name Column -->
           <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Hospital Email </th>
            <td mat-cell *matCellDef="let element,"> {{element.hospital_email}} </td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-neutral-500 dark:text-neutral-400"> Action </th>
            <td mat-cell *matCellDef="let element">
              <emr-segmented theme="simple" class="-mx-2">
                <emr-segmented-button *ngIf="!element.deleted_at" value="edit_squareData">
                  <span class="size-9 rounded-full border bg-surface flex items-center justify-center" (click)="updateHospital(element)" *ngIf="permission.parmissionMatched(['Update Hospital'])" matTooltip="Edit">
                    <mat-icon class="font-icon edit_squareData">edit_square</mat-icon>
                  </span>
                </emr-segmented-button>
                <emr-segmented-button value="edit_squareData">
                  <mat-slide-toggle
                    [checked]="!element.deleted_at"
                    (toggleChange)="confirmBlock(element)"
                    color="primary">
                  </mat-slide-toggle>
                </emr-segmented-button>
              </emr-segmented>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell tablefoter" colspan="10"><app-empty-state title="No hospitals found" [message]="input.value ? 'No hospitals match your search.' : 'Hospital records will appear here.'" icon="local_hospital" /></td>
          </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[10, 20]"
                       showFirstLastButtons
                       aria-label="Select page of country" class="pt-3">
        </mat-paginator>
      </div>
  </app-section-card>
</div>
