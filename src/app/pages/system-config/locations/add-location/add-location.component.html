<div class="ui-form-dialog">
  <app-form-header
    eyebrow="System configuration"
    title="Add location"
    description="Add a location and its display label."
    icon="location_on"
  />

  <div class="ui-form-dialog__body">
      <form [formGroup]="locationForm">
        <mat-form-field class="w-full mt-6">
          <mat-label>Location Name</mat-label>
          <input matInput placeholder="Ex. Amani" formControlName="location_name" type="text">
          <mat-error class="error-message" *ngIf="locationForm.controls['location_name'].touched && locationForm.controls['location_name'].invalid">
            <span *ngIf="locationForm.controls['location_name'].errors?.['required']">This field is mandatory</span>
            <span *ngIf="locationForm.controls['location_name'].errors?.['pattern']">This field is invalid (must be contain alpharbetical only)</span>
          </mat-error>
        </mat-form-field>
        <mat-form-field class="w-full mt-6">
          <mat-label>Label</mat-label>
          <input matInput placeholder="Ex. Administration" formControlName="label" type="text">
        </mat-form-field>
      </form>
  </div>

  <mat-dialog-actions align="end" class="ui-form-dialog__actions">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button cdkFocusInitial [disabled]="locationForm.invalid || submitting" (click)="saveLocation()">{{ submitting ? 'Saving...' : 'Save Location' }}</button>
  </mat-dialog-actions>
</div>
